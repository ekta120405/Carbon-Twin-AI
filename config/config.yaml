# CarbonTwinAI — master configuration
# Every magic number in the pipeline lives here, not in code.

project:
  name: CarbonTwinAI
  random_seed: 42

paths:
  raw_kaggle:  data/raw/kaggle
  raw_nasa:    data/raw/nasa_power
  interim:     data/interim
  processed:   data/processed
  reports:     reports

# ---------- Layer 1: data ----------
layer1:
  timezone:
    source_tz: Asia/Kolkata      # Kaggle timestamps are naive IST
    pipeline_tz: UTC             # everything downstream is tz-aware UTC
    solar_noon_tolerance_min: 90 # abort if generation peak deviates more

  resample:
    target_freq: 15min
    method: clear_sky_index      # NEVER ffil l or linear on irradiance directly
    clearsky_model: ineichen

  quality:
    min_solar_elevation_deg: 10.0  # daylight mask
    ceiling_tolerance_training: 1.32   # generous — excludes from Layer 2 training only.
                                        # Recalibrated empirically against observed
                                        # NASA-vs-onsite divergence (Task 5 finding:
                                        # mean +27-28% at violation rows, both plants).
    ceiling_tolerance_fraud: 1.05      # strict — reserved for Layer 3 max-severity flags
                                        # (night generation, gross overshoot only).
    stuck_sensor_run_length: 8     # identical daylight values -> sensor fault
    drop_negative_power: true

  capacity:
    estimate_from_data: true
    percentile: 99.5
    min_clearsky_index: 0.90

  splits:                        # contiguous DAY blocks — never shuffle
    train_days:          [1, 20]
    calib_days:          [21, 25]   # clean only; conformal calibration
    test_clean_days:     [26, 30]
    test_injected_days:  [31, 34]

# ---------- Layer 2: twin ----------
layer2:
  target: residual_to_physics    # options: residual_to_physics | direct
  quantiles: [0.1, 0.5, 0.9]
  model:
    # Tuned down from the original (num_leaves=15, n_estimators=600,
    # lambda_l2=5.0) after empirically confirming severe overfitting on
    # this dataset's small per-regime training counts (e.g. only 9-12 rows
    # at Kt<0.4) -- original config produced negative test-set R^2 in
    # overcast conditions for plant_2. See Layer 2 build notes.
    num_leaves: 7
    max_depth: 3
    min_data_in_leaf: 20
    learning_rate: 0.05
    n_estimators: 80
    feature_fraction: 0.7
    bagging_fraction: 0.7
    bagging_freq: 1
    lambda_l2: 10.0
  monotone:
    poa_global: 1                # expected power non-decreasing in irradiance
    clearsky_index: 1
    temp_cell: -1
  online:
    mode: rolling_refit          # simpler and safer than incremental boosting
    window_days: 20
    refit_every_days: 1

  physics_anchor:
    gamma_pdc: -0.004            # /degC, typical c-Si temperature coefficient
    inverter_ac_dc_ratio: 1.10
    system_losses: 0.14          # PVWatts default total loss fraction
  baselines:
    seed: 20260812                # reuse the injector's seed for consistency across the project
    ridge:
      alpha: 1.0
    lstm:
      seq_len: 8                  # 8 x 15-min = 2 hours of weather context
      hidden_size: 32
      num_layers: 2
      epochs: 60
      learning_rate: 0.001
      batch_size: 64

# ---------- Layer 3: anomaly detection ----------
layer3:
  residual:
    normalise_by: ac_nameplate
    decision_window: daily        # primary decision level
  conformal:
    alpha: 0.05
    one_sided: true               # over-claims only; under-claims -> fault channel
    stratify_by_clearsky_index: true
    csi_bins: [0.0, 0.4, 0.75, 1.05]
  cusum:
    k: 0.25                       # slack, in residual sigma units
    h: 5.0                        # SCAFFOLD DEFAULT ONLY -- not used directly.
                                   # Actual threshold is empirically bootstrap-
                                   # calibrated at runtime against the pooled
                                   # calib+test_clean reference (see
                                   # calibrate_h_from_clean_data() in cusum.py).
                                   # As of the calibration in this commit:
                                   # h=4.0 for a 9-day window at ~5% target FPR,
                                   # both plants. Will differ if the reference
                                   # pool or window length changes -- recompute,
                                   # don't hardcode.
  autoencoder:
    hidden: [8, 4, 8]
    epochs: 200
    learning_rate: 0.001

  escalation:
    # Secondary-evidence escalation: upgrades a 'normal' day to
    # 'flagged_overclaim' when its r_day sits close below the main
    # conformal threshold AND at least one secondary signal (the
    # autoencoder's calibrated run-length flag, or CUSUM's running
    # statistic) corroborates. Added after src/evaluation/_experiment_*
    # scripts found the naive version (escalating ANY near-threshold day,
    # or trusting the autoencoder/CUSUM as a blanket OR) either overfit to
    # the known 30-replicate test set or cost more in false positives than
    # it gained -- see docs/TASK7_HANDOFF.md and PROJECT_RESULTS_SUMMARY.md.
    #
    # band_width and cusum_frac below were chosen via an honest split
    # validation: swept on replicates 0-19 only ("tune"), then verified on
    # the untouched replicates 20-29 ("holdout") -- the most aggressive
    # tune-set winner (band_width=0.7, cusum_frac=0.0) DID generalize on
    # that holdout (F1 0.716->0.794), but a SEPARATE check (not part of
    # the replicate pool at all) found it also flagged real, hand-verified
    # honest data -- including, in one case, the exact calib day that
    # DEFINED the conformal threshold itself (a real bug, since fixed --
    # see escalation.py's near_threshold comment -- but the parameters
    # were also simply too aggressive for that acceptance check even after
    # the bug fix). Backed off to this more conservative pair: still a
    # real, substantial gain (pooled recall 58.5%->64.8%, F1 0.677->0.723)
    # with ZERO specificity cost on the pooled hard-negative test (0.920,
    # unchanged), and it restores the real-clean/real-full acceptance
    # blocks to a clean "Low" risk band on both plants. See
    # docs/TASK7_HANDOFF.md for the full story, including why the more
    # aggressive pair was rejected despite validating on the replicate
    # holdout -- generalizing to unseen REPLICATES is not the same claim
    # as generalizing to genuinely different REAL data.
    enabled: true
    band_width: 0.8       # escalate if r_day > band_width * threshold (and < threshold, strictly)
    cusum_frac: 0.5        # escalate if cusum_s_t > cusum_frac * cusum_h

# ---------- Layer 4: XAI, carbon, reporting ----------
layer4:
  shap:
    explain_flagged_only: true    # full-dataset SHAP is unnecessary
    max_flags_explained: 500
  carbon:
    grid_emission_factor_tco2_per_mwh: 0.7383   # CEA CO2 Baseline Database v21.0 (Nov 2025),
                                                  # Combined Margin, FY2024-25 — the variant CEA
                                                  # itself specifies for RE project emission-reduction
                                                  # crediting, NOT the WAEF (0.7117) used for corporate
                                                  # Scope 2 reporting. Vintage mismatch vs. the dataset's
                                                  # 2020 generation period is a documented simplification,
                                                  # not an oversight — see paper §[carbon accounting].
    carbon_price_usd_per_tco2: 5.00   # Low end of the $4-6/tCO2e range typical for grid-connected
                                        # renewable-energy avoidance credits specifically (NOT the
                                        # market's oft-cited $6.34 blended average, which is dominated
                                        # by higher-priced removal/durability credit types unrelated
                                        # to this project). Reflects the documented EMDE pricing
                                        # discount (~28% below advanced-economy credits) applicable
                                        # to an India-origin project. Sources: Ecosystem Marketplace
                                        # State of the VCM 2025; Emsurge project-listing dataset via
                                        # carboncredits.com (accessed 2026).
  severity_weights:
    magnitude: 0.4
    confidence: 0.2
    persistence: 0.2
    tco2e_at_risk: 0.2
